<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Plant App - Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Native Plant App</h1>
        <p>Your Mobile Guide to Regional Flora</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="details.html">Plant Details</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="admin.html">Admin</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Search Native Plants</h2>
            <p>Filter our regional plant database by name, keyword, or sunlight requirements.</p>

            <div style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                <div>
                    <label for="keyword" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Search Keyword:</label>
                    <input type="text" id="keyword" placeholder="Enter plant name..." style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div>
                    <label for="sun" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Sunlight:</label>
                    <select id="sun" style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="all">All Sunlight Types</option>
                        <option value="Full Sun">Full Sun</option>
                        <option value="Part Shade">Part Shade</option>
                        <option value="Shade">Shade</option>
                    </select>
                </div>
                <div style="align-self: flex-end;">
                    <button id="filter-btn" style="padding: 0.5rem 1rem; background-color: #2d5a27; color: white; border: none; border-radius: 4px; cursor: pointer;">Filter</button>
                </div>
            </div>

            <!-- Dynamic Plant Cards Grid -->
            <div class="plant-grid">
                <!-- JavaScript will dynamically insert plant cards here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Native Plant Initiative App</p>
    </footer>

    <!-- Link your interactive JavaScript -->
    <script src="script.js"></script>
</body>
</html>
